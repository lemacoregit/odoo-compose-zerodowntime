[options]
admin_passwd = FT3ongCmDZ8krcObxokD

; Addons loaded in order: default (core) → extra (community) → custom (project)
addons_path = /mnt/default-addons, /mnt/extra-addons, /mnt/custom-addons

; --- Security ---
; list_db = True  → DB manager accessible (use during initial setup)
; list_db = False → hide DB manager (switch to this after DB is created)
list_db = True
; Restrict Odoo to only serve this database — uncomment AFTER database is created
; dbfilter = ^odoo$

proxy_mode = True

; --- Logging ---
logfile = /etc/odoo/logs/odoo-server.log
log_level = info
log_handler = :INFO

; --- Performance ---
; workers = 0 → single-process, use this when creating database for the first time
;               (avoids concurrent registry load race condition across workers)
; workers = 4 → multi-worker production mode (default after DB is initialized)
max_cron_threads = 2
workers = 4
limit_memory_soft = 2147483648
limit_memory_hard = 3221225472
limit_time_cpu = 120
limit_time_real = 600
limit_request = 8192

; --- Database ---
db_maxconn = 64

; --- Server ---
server_wide_modules = base,web,lm_session_redis
data_dir = /etc/odoo

longpolling_port = 8072
gevent_port = 8072
xmlrpc_port = 8069
