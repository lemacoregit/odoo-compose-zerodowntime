[options]
admin_passwd = FT3ongCmDZ8krcObxokD

; Addons loaded in order: default (core) → extra (community) → custom (project)
addons_path = /mnt/default-addons, /mnt/extra-addons, /mnt/custom-addons

; --- Security ---
; list_db = True  → shows DB manager UI (default, leave this on until DB is created)
; list_db = False → hides DB manager after DB is created (recommended for production)
list_db = True
; Restrict Odoo to only serve this database — uncomment AFTER database is created via UI
; dbfilter = ^odoo$

proxy_mode = True

; --- Logging ---
logfile = /etc/odoo/logs/odoo-server.log
log_level = info
log_handler = :INFO

; --- Performance ---
max_cron_threads = 1
workers = 4
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 120
limit_time_real = 600
limit_request = 8192

; --- Database ---
db_maxconn = 64

; --- Server ---
server_wide_modules = base,web
data_dir = /etc/odoo

longpolling_port = 8072
gevent_port = 8072
xmlrpc_port = 8069
