# Redis configuration for Odoo 18 session store
# Password is injected at runtime via --requirepass arg (not stored here)

# --- Persistence ---
# Disabled — Redis is used as session store only, no data worth persisting
appendonly no
save ""

# --- Memory ---
maxmemory 256mb
# Evict least-recently-used keys when memory limit is reached
maxmemory-policy allkeys-lru

# --- Connections ---
# Close idle client connections after 300 seconds
timeout 300
tcp-keepalive 60
# Maximum number of simultaneous clients
maxclients 100

# --- Logging ---
loglevel warning
logfile ""

# --- Security ---
# Disable dangerous commands not needed for session store
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# --- Performance ---
hz 15
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
