# Redis configuration for Odoo 18 session store
# Password is injected at runtime via --requirepass arg (not stored here)

# --- Network ---
bind 0.0.0.0
# Password auth is enforced via --requirepass; no need for protected-mode
protected-mode no

# --- Persistence ---
# Disabled — Redis is used as session store only, no data worth persisting
appendonly no
save ""

# --- Memory ---
maxmemory 256mb
# Evict least-recently-used keys when memory limit is reached
maxmemory-policy allkeys-lru

# --- Connections ---
# Close idle client connections after 300 seconds
timeout 300
tcp-keepalive 60
# Maximum number of simultaneous clients
maxclients 100

# --- Logging ---
loglevel warning
logfile ""

# --- Security ---
# CONFIG must remain enabled — Redis 8.x uses it internally during startup.
# Disable only commands that are genuinely dangerous for a session-store workload.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

# --- Performance ---
hz 15
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
